name: CI

on:
  # Every pushed branch, so a fix branch shows green or red before it is merged (RULES-8-01: main was red for 22 pushes).
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Accounts: a throwaway sign-in secret for this run only, so the judge sign-in e2e works (no OAuth in CI).
      - run: echo "AUTH_SECRET=$(openssl rand -base64 33)" >> "$GITHUB_ENV"
      # No model key in CI. Live-data specs run one at a time (playwright.config.ts "live" project) and
      # decide on the server's error code: MODEL_NOT_CONFIGURED, a busy OpenStreetMap or our per-IP
      # limit is checked and reported as SKIPPED with the code, never as passed (tests/e2e/support/honest.ts).
      # No example warm-up in CI: it could only end in "no AI key".
      - run: pnpm e2e
        timeout-minutes: 25
        env:
          E2E_BASE_URL: http://localhost:3123
          PREWARM_EXAMPLES: "0"
      # SEC-3-01: a visitor's walk at the DEFAULT per-IP limits (its own server, no raised PRELIMIT_*).
      - run: pnpm e2e:limits
        timeout-minutes: 10
        env:
          E2E_LIMITS_BASE_URL: http://localhost:3124
          PREWARM_EXAMPLES: "0"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
